<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de personagem</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#14121f;color:#e8e6ff;font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px;display:grid;gap:16px}@media(min-width:820px){.wrap{grid-template-columns:420px 1fr;align-items:start}.stage{position:sticky;top:14px}}
h1{font:13px/1.4 'Press Start 2P',monospace;color:#3fd0c9;margin:0 0 6px}p{color:#9a96c0;margin:0 0 10px;font-size:13px}
.stage{background:#14121f;z-index:2}@media(max-width:819px){.stage{position:sticky;top:0;padding-top:6px}}
#cv{display:block;width:100%;max-width:420px;aspect-ratio:1;border:2px solid #3b3560;margin:0 auto}
.row{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}.chip,button{flex:none;font:inherit;font-size:13px;color:#cfcbf5;background:#1d1a30;border:2px solid #3b3560;padding:7px 11px;cursor:pointer;white-space:nowrap}
.chip.on{background:#3fd0c9;border-color:#3fd0c9;color:#10241f;font-weight:600}
h3{font:10px/1.4 'Press Start 2P',monospace;color:#ffd45a;margin:18px 0 8px}
.sl{display:block;margin:0 0 12px}.sl span{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px}.sl em{font-style:normal;color:#3fd0c9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#3fd0c9;height:26px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.col{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#9a96c0}
input[type=color]{width:100%;height:40px;border:2px solid #3b3560;background:#1d1a30;padding:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button.pri{background:#3fd0c9;border-color:#3fd0c9;color:#10241f;font-weight:600}
textarea{width:100%;margin-top:10px;background:#1d1a30;color:#e8e6ff;border:2px solid #3b3560;font:12px monospace;padding:8px;height:70px}#msg{color:#ffd45a;font-size:13px;min-height:18px;margin-top:6px}</style></head><body>
<div class="wrap"><div class="stage"><h1>EDITOR DE PERSONAGEM</h1><p>Mexa nos controles e veja o boneco mudar na hora. Os ajustes ficam salvos neste navegador.</p>
<canvas id="cv" width="640" height="640"></canvas>
<div class="row" id="chips"></div><div class="row"><button id="pp">❚❚ Pausar</button><button id="rot">↻ Girar</button></div></div>
<div><h3>Estilo base</h3><div class="row" id="sty"></div><div id="ctl"></div>
<div class="acts"><button class="pri" id="cp">Copiar ajustes</button><button id="rst">Restaurar padrão</button></div>
<textarea id="out" hidden readonly></textarea><div id="msg"></div></div></div>
<script>const D2R=Math.PI/180;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],vlen=a=>Math.hypot(a[0],a[1],a[2]);
const nrm=a=>{const l=vlen(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const COL={
skin:['#f6c590','#dba26a','#b98050'],hair:['#ffe27a','#e8c24a','#c29f2c'],shorts:['#5b6cf0','#4553c8','#34409a'],
shoe:['#f4f4f4','#cfcfcf','#a5a5a5'],eye:['#1a1a3a','#12122b','#0b0b1d'],bar:['#d8d8d8','#b0b0b0','#8a8a8a'],
plate:['#6a6a6a','#4a4a4a','#333333'],frame:['#aab3c4','#848da0','#646c7d'],pad:['#5d5d86','#484869','#37374f'],
gold:['#ffd45a','#e0b13a','#b78a20'],hole:['#15141a','#15141a','#15141a'],stack:['#4a505d','#373c47','#2a2e37'],kb:['#5e6575','#454b58','#33373f'],band:['#3fcf7d','#2ea862','#1f7e48'],cable:['#f5f5f5','#d6d6d6','#b8b8b8'],
red:['#e0453f','#b83530','#8e2724'],redH:['#ff8676','#ff4a40','#d1302b'],
or:['#f0993a','#cc7a24','#a35f18'],orH:['#ffc860','#ff9a2e','#d37a18'],
fa:['#3a3560','#2d2950','#231f3f'],fb:['#322e55','#27234a','#1e1b3a'],fs:['#241f40','#1c1832','#151226']};
function mk(){const m=new Map();return {m,set(x,y,z,k,tag){x=Math.floor(x);y=Math.floor(y);z=Math.floor(z);m.set(x+','+y+','+z,{x,y,z,k,tag:tag||null});},has(x,y,z){return m.has(Math.floor(x)+','+Math.floor(y)+','+Math.floor(z));}};}
function box(V,x0,x1,y0,y1,z0,z1,k,tag){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)V.set(x,y,z,k,tag);}
function line(V,a,b,k,tag){const d=sub(b,a),L=vlen(d),n=Math.max(1,Math.ceil(L/0.3));for(let i=0;i<=n;i++){const q=add(a,mul(d,i/n));V.set(q[0],q[1],q[2],k,tag);}}
function limb(V,A,B,uF,k,tF,tB,cf){
 const d=sub(B,A),L=vlen(d);if(L<0.01)return;const ax=nrm(d);
 let u=sub(uF,mul(ax,dot(uF,ax)));
 if(vlen(u)<0.3){u=sub([1,0,0],mul(ax,ax[0]));if(vlen(u)<0.3)u=sub([0,0,1],mul(ax,ax[2]));}
 u=nrm(u);const w=crs(ax,u);const n=Math.max(1,Math.ceil(L/0.4));
 for(let i=0;i<=n;i++){const fr=i/n,p=add(A,mul(d,fr)),kk=cf?cf(fr):k;
  for(const su of [-1,1])for(const sw of [-1,1]){const q=add(add(p,mul(u,0.5*su)),mul(w,0.5*sw));V.set(q[0],q[1],q[2],kk,su>0?tF:tB);}}}
const BASE={P:[14,11.5],r:0,sh:0,h:[0,0,-8.6],e:[-0.5,0.5,-1],f:[14,2.2,1.2],k:[1,0.2,0.2]};
const SYM=['h','e','f','k','a'];
function expand(q){const o={};
 for(const k of SYM)if(q[k]){o[k+'L']=q[k];o[k+'R']=q[k];}
 for(const k of SYM)for(const s of ['L','R'])if(q[k+s])o[k+s]=q[k+s];
 for(const s of ['L','R'])if(o['h'+s]&&!o['a'+s])o['a'+s]=null;
 for(const k in q)if(!SYM.includes(k)&&!/^[hefka][LR]$/.test(k))o[k]=q[k];
 return o;}
function merged(ex){if(ex._m)return ex._m;const b=Object.assign({},expand(BASE),expand(ex.base||{}));
 ex._m=[Object.assign({},b,expand(ex.A)),Object.assign({},b,expand(ex.B))];return ex._m;}
function getPose(ex,t){const [A,B]=merged(ex);const o={};
 for(const k in Object.assign({},A,B)){const a=A[k],b=B[k];
  if(Array.isArray(a)&&Array.isArray(b))o[k]=a.map((v,i)=>v+(b[i]-v)*t);
  else if(typeof a==='number'&&typeof b==='number')o[k]=a+(b-a)*t;
  else o[k]=(t<0.5?(a!==undefined?a:b):(b!==undefined?b:a));}
 return o;}
function ik(S,T,L1,L2,pole){let d=sub(T,S),D=vlen(d);const mx=L1+L2-0.05,mn=Math.abs(L1-L2)+0.4;
 if(D>mx){d=mul(d,mx/D);D=mx;}if(D<mn){d=D<1e-6?[0,0,-mn]:mul(d,mn/D);D=mn;}
 const u=nrm(d),a=(L1*L1-L2*L2+D*D)/(2*D),h=Math.sqrt(Math.max(0,L1*L1-a*a));
 let n=sub(pole,mul(u,dot(pole,u)));if(vlen(n)<1e-3){n=sub([0,0,1],mul(u,u[2]));if(vlen(n)<1e-3)n=[1,0,0];}
 n=nrm(n);return {m:add(add(S,mul(u,a)),mul(n,h)),e:add(S,d)};}
function solve(p){
 const phi=p.r*D2R,F=[Math.cos(phi),0,Math.sin(phi)],Sd=[-Math.sin(phi),0,Math.cos(phi)];
 const P=[p.P[0],0,p.P[1]],shc=add(add(P,mul(Sd,7.5)),[0,0,p.sh||0]),head=add(P,mul(Sd,10.6));
 const S={p,F,Sd,P,head,sh:{},hip:{},hand:{},elb:{},knee:{},ank:{}};
 for(const [s,sg] of [['L',-1],['R',1]]){
  const Sh=add(shc,[0,sg*3.6,0]);S.sh[s]=Sh;let T;
  if(p.hh)T=add(add(head,mul(F,-1.0)),[0,sg*2.4,0]);
  else if(p['a'+s]){const a=p['a'+s];T=[a[0],sg*a[1],a[2]];}
  else{const h=p['h'+s];T=add(Sh,[h[0],sg*h[1],h[2]]);}
  const e=p['e'+s],r=ik(Sh,T,4.5,4.5,[e[0],sg*e[1],e[2]]);S.elb[s]=r.m;S.hand[s]=r.e;
  const Hp=add(P,[0,sg*1.7,0]);S.hip[s]=Hp;
  const f=p['f'+s],k=p['k'+s],rk=ik(Hp,[f[0],sg*f[1],f[2]],5.3,5.2,[k[0],sg*k[1],k[2]]);S.knee[s]=rk.m;S.ank[s]=rk.e;}
 return S;}
function dumbbell(V,c,ax){const cx=Math.floor(c[0]),cy=Math.floor(c[1]),cz=Math.floor(c[2]);
 for(let t=-2;t<=2;t++){const at=Math.abs(t);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
   if(at<2&&(i||j))continue;const o=[0,0,0];const idx=[0,1,2].filter(x=>x!==ax);o[ax]=t;o[idx[0]]=i;o[idx[1]]=j;
   V.set(cx+o[0],cy+o[1],cz+o[2],at<2?'bar':'plate');}}}
function body(V,S){
 const {p,F,Sd,P}=S;
 for(let s=-1.6;s<=7.9;s+=0.4){
  const waist=s>=2.2&&s<5;const as=waist?[-1.5,-0.5,0.5,1.5]:[-2.5,-1.5,-0.5,0.5,1.5,2.5];
  for(const a of as)for(const b of [-1.5,-0.5,0.5,1.5]){
   const q=add(add(add(P,mul(Sd,s)),[0,a,0]),mul(F,b));const fr=b>0;let k='skin',tag=null;
   if(s<2.2){k='shorts';tag=fr?(s>1?'abs':null):'glutes';}
   else if(s<5)tag=fr?'abs':'lowback';
   else tag=(fr||(Math.abs(a)>2&&b>-1))?'chest':(s>=6.8&&Math.abs(a)<=1.6?'traps':'back');
   V.set(q[0],q[1],q[2],k,tag);}}
 for(const sg of ['L','R']){const Sh=S.sh[sg];for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let l=-1;l<=1;l++)if(i*i+j*j+l*l<=2)V.set(Math.floor(Sh[0])+i,Math.floor(Sh[1])+j,Math.floor(Sh[2])+l,'skin','delts');}
 limb(V,add(P,mul(Sd,7.6)),add(P,mul(Sd,9.2)),F,'skin','traps','traps');
 const hc=S.head.map(Math.floor);
 const fa=Math.abs(F[0])>=Math.abs(F[2])?0:2,sa=fa===0?2:0,fs=Math.sign(F[fa])||1,ss=Math.sign(Sd[sa])||1;
 for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let l=-1;l<=1;l++){
  const o=[i,j,l],fo=o[fa]*fs,so=o[sa]*ss;let k='skin';
  if(so===1||fo===-1)k='hair';else if(fo===1&&so===0&&j!==0)k='eye';
  V.set(hc[0]+i,hc[1]+j,hc[2]+l,k);}
 const fwdsign=(p.tx||1);
 for(const [s,sg] of [['L',-1],['R',1]]){
  const Sh=S.sh[s],El=S.elb[s],Ha=S.hand[s];
  const dU=nrm(sub(El,Sh)),dF=sub(Ha,El);let uF=sub(dF,mul(dU,dot(dF,dU)));if(vlen(uF)<0.8)uF=F;
  limb(V,Sh,El,uF,'skin','biceps','triceps');limb(V,El,Ha,uF,'skin','forearm','forearm');
  box(V,Math.floor(Ha[0]-0.5),Math.floor(Ha[0]+0.5),Math.floor(Ha[1]-0.5),Math.floor(Ha[1]+0.5),Math.floor(Ha[2]-0.5),Math.floor(Ha[2]+0.5),'skin');
  const Hp=S.hip[s],Kn=S.knee[s],An=S.ank[s];
  const sh2=sub(An,Kn);let bend=sub(sh2,mul(nrm(sub(Kn,Hp)),dot(sh2,nrm(sub(Kn,Hp)))));
  let uL=vlen(bend)>0.8?mul(bend,-1):F;
  limb(V,Hp,Kn,uL,'skin','quads','hams',fr=>fr<0.4?'shorts':'skin');
  limb(V,Kn,An,uL,'skin',null,'calves');
  const high=An[2]>4.5;const toe=high?add(An,[2.6*fwdsign,0,-1]):[An[0]+3*fwdsign,An[1],0.3];
  const d=sub(toe,An),n=Math.ceil(vlen(d)/0.3);
  for(let i=0;i<=n;i++){const q=add(An,mul(d,i/n));for(const o of [-0.5,0.5])V.set(q[0],q[1]+o,q[2]-0.3,'shoe');}
  V.set(An[0]-0.5,An[1]-0.5,An[2]-0.3,'shoe');V.set(An[0]-0.5,An[1]+0.5,An[2]-0.3,'shoe');
 }}
function benchBack(V,Pp,r,seatLen){
 const phi=r*D2R,F=[Math.cos(phi),0,Math.sin(phi)],Sd=[-Math.sin(phi),0,Math.cos(phi)];const P=[Pp[0],0,Pp[1]];
 for(let s=1.5;s<=13;s+=0.35)for(const b of [-2.6,-3.2])for(let y=-2;y<=1;y++){const q=add(add(P,mul(Sd,s)),mul(F,b));V.set(q[0],y,q[2],'pad');}
 const sz=Math.floor(Pp[1]-2.2);
 seatBox(V,Math.floor(Pp[0]-1.5),Math.floor(Pp[0]+(seatLen||5)),sz);
 if(r>20){const q=add(add(P,mul(Sd,4)),mul(F,-3.4));for(const y of [-2,1])line(V,[Math.floor(Pp[0])-1,y+0.5,sz-1],[q[0],y+0.5,q[2]],'frame');}}
function seatBox(V,x0,x1,sz){box(V,x0,x1,-2,1,sz,sz,'pad');
 for(const x of [x0+1,x1-1])for(const y of [-2,1])box(V,x,x,y,y,0,sz-1,'frame');
 for(const y of [-2,1])box(V,x0+1,x1-1,y,y,0,0,'frame');}
function flatBench(V,x0,x1,zt){seatBox(V,x0,x1,zt-1);}
function mc1000(V,cx,cy,fx,fy,carZ,o){o=o||{};const vx=-fy,vy=fx;
 const P=(u,v,z,k)=>V.set(cx+fx*u+vx*v,cy+fy*u+vy*v,z,k);
 const B=(u0,u1,v0,v1,z0,z1,k)=>{for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++)for(let z=z0;z<=z1;z++)P(u,v,z,k);};
 B(0,1,0,1,1,30,'frame');                                   // coluna da polia
 for(let n=1;n<=9;n++)P(1,0,Math.round(29-(n-1)*3.2),'hole');   // furos 1..9
 B(-4,-3,7,8,1,31,'frame');                                  // poste traseiro
 B(-3,-2,3,6,1,15,'stack');                                  // pilha de pesos
 for(let z=16;z<=29;z++){P(-3,3,z,'bar');P(-3,6,z,'bar');}   // hastes guia
 B(-4,1,0,1,31,31,'frame');B(-4,-3,0,8,31,31,'frame');B(-4,1,7,8,31,31,'frame');
 B(0,2,0,1,32,32,'gold');                                     // polia alta
 const hz=o.hz||31,hu=o.hu||3;B(1,hu,0,1,hz,hz,'frame');B(hu,hu,-7,8,hz,hz,'bar'); // pegadores da barra fixa
 for(let u=0;u<=5;u++){P(u,-Math.round(u*0.8),0,'frame');P(u,1+Math.round(u*0.8),0,'frame');} // base em V
 B(-5,-2,-1,9,0,0,'frame');
 if(carZ!==null&&carZ<29)B(1,2,-1,2,Math.round(carZ)-1,Math.round(carZ)+1,'gold');   // carrinho da polia
}
function machine(V,ax,ay,az,pers){
 const side=Math.abs(ay)>3,behind=!side&&ax<pers;
 if(side){const s=Math.sign(ay);mc1000(V,Math.floor(ax),Math.round(ay)+(s>0?1:-1),0,-s,az);}
 else if(behind)mc1000(V,Math.floor(ax)-1,0,1,0,az);
 else mc1000(V,Math.floor(ax)+1,0,-1,0,az);}
function cable(V,S,c,pers){
 const a=c.a;machine(V,a[0],a[1],a[2],pers);
 const hl=S.hand.L,hr=S.hand.R,tgt={};
 if(c.to==='hands'){
  const m=mul(add(hl,hr),0.5);
  if(c.att==='rope'){line(V,a,m,'cable');line(V,m,hl,'cable');line(V,m,hr,'cable');box(V,Math.floor(m[0]),Math.floor(m[0]),Math.floor(m[1])-1,Math.floor(m[1]),Math.floor(m[2]),Math.floor(m[2]),'gold');}
  else{line(V,a,m,'cable');line(V,hl,hr,'bar');}}
 else if(c.to==='handR'||c.to==='handL'){const h=S.hand[c.to.slice(-1)];line(V,a,h,'cable');V.set(h[0],h[1],h[2],'gold');}
 else{const an=S.ank[c.to.slice(-1)];line(V,a,an,'cable');box(V,Math.floor(an[0]-0.5),Math.floor(an[0]+0.5),Math.floor(an[1]-0.5),Math.floor(an[1]+0.5),Math.floor(an[2]-0.5),Math.floor(an[2]+0.5),'gold');}}
function propFn(V,pr,S){
 if(pr.t==='flat')flatBench(V,pr.x0,pr.x1,pr.z);
 else if(pr.t==='pullup'){mc1000(V,Math.round(pr.x)+5,0,-1,0,null,{hz:Math.round(pr.z),hu:5});}
 else if(pr.t==='dips'){const xc=pr.x1+2;for(const y of [-5,4])box(V,pr.x0+3,pr.x1+1,y,y,pr.z,pr.z,'bar');box(V,pr.x1+1,pr.x1+1,-5,4,pr.z,pr.z,'frame');mc1000(V,xc,0,-1,0,null);}
 else if(pr.t==='rail'){for(const y of [-6,5])box(V,pr.x,pr.x,y,y,0,pr.z,'frame');box(V,pr.x,pr.x,-6,5,pr.z,pr.z,'bar');}
 else if(pr.t==='cable')cable(V,S,pr,S.P[0]);}
function buildScene(ex,t){
 const V=mk(),pA=getPose(ex,0),p=getPose(ex,t),S=solve(p);
 if(ex.bench==='back')benchBack(V,pA.P,pA.r,ex.seatLen);
 else if(ex.bench==='seat')seatBox(V,Math.floor(pA.P[0]-3),Math.floor(pA.P[0]+3),Math.floor(pA.P[1]-2.2));
 for(const pr of (ex.props||[]))if(pr.t!=='cable')propFn(V,pr,S);
 body(V,S);
 for(const pr of (ex.props||[]))if(pr.t==='cable')propFn(V,pr,S);
 const d=ex.db;
 if(d==='two'){for(const s of ['L','R'])dumbbell(V,S.hand[s],{x:0,y:1,z:2}[ex.da||'y']);}
 else if(d==='R'||d==='L')dumbbell(V,S.hand[d],{x:0,y:1,z:2}[ex.da||'y']);
 else if(d==='one')dumbbell(V,mul(add(S.hand.L,S.hand.R),0.5),{x:0,y:1,z:2}[ex.da||'y']);
 const sh=new Set();for(const v of V.m.values())if(v.z>=0)sh.add(v.x+','+v.y);
 return {vox:[...V.m.values()],shadow:sh};}
const VW=200,VH=170,OX=72,OY=100;
function rotc(x,y,k){for(let i=0;i<k;i++){const nx=13-y,ny=x-14;x=nx;y=ny;}return [x,y];}
function sceneItems(sc,view,ex,hot,fb){
 const items=[];
 for(let x=fb[0];x<=fb[1];x++)for(let y=fb[2];y<=fb[3];y++){const [rx,ry]=rotc(x,y,view);items.push({sx:(rx-ry)*2+OX,sy:(rx+ry)+OY,d:rx+ry-100,c:COL[sc.shadow.has(x+','+y)?'fs':((x+y)&1?'fa':'fb')]});}
 const pr=ex.prim||[],sc2=ex.sec||[];
 for(const v of sc.vox){const [rx,ry]=rotc(v.x,v.y,view);let k=v.k;
  if(v.tag&&pr.includes(v.tag))k=hot?'redH':'red';else if(v.tag&&sc2.includes(v.tag))k=hot?'orH':'or';
  items.push({sx:(rx-ry)*2+OX,sy:(rx+ry)-(v.z+1)*2+OY,d:rx+ry+v.z,c:COL[k]});}
 return items;}
function viewInfo(ex){

function styleOf(key){const s=VST[key],c=Object.assign({},s.c);
 if(CP.cSkin){c.skin=[CP.cSkin,shadeHex(CP.cSkin,0.82)];if(key!=='sil'&&key!=='line')c.eye=c.eye;}
 if(CP.cHair)c.hair=[CP.cHair,shadeHex(CP.cHair,0.82)];if(CP.cShorts)c.shorts=[CP.cShorts,shadeHex(CP.cShorts,0.78)];
 return Object.assign({},s,{c,bg:CP.cBg||s.bg});}
let PXC=null;const PALC=new Map();
function rgbOf(s){if(s[0]==='#'){const n=parseInt(s.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255,1];}const m=s.match(/[\d.]+/g).map(Number);return [m[0],m[1],m[2],m.length>3?m[3]:1];}
function paletteOf(st){const key=JSON.stringify([st.c,st.bg,st.ink,st.grid,st.shadow,st.shade]);if(PALC.has(key))return PALC.get(key);
 const bg=rgbOf(st.bg),out=[],over=(a,b)=>[a[0]*(1-b[3])+b[0]*b[3],a[1]*(1-b[3])+b[1]*b[3],a[2]*(1-b[3])+b[2]*b[3]];
 const add=c=>out.push([Math.round(c[0]),Math.round(c[1]),Math.round(c[2])]);
 add(bg);add(over(bg,rgbOf(st.grid)));const sh=over(bg,rgbOf(st.shadow));add(sh);add(over(over(bg,rgbOf(st.grid)),rgbOf(st.shadow)));
 const ink=rgbOf(st.ink);add(ink[3]<1?over(bg,ink):ink);
 for(const k in st.c)for(const h of st.c[k]){const c=rgbOf(h);add(c);if(st.shade&&st.cel)add(over(c,rgbOf(st.shade)));}
 PALC.set(key,out);return out;}
function quantize(cv,st){const g=cv.getContext('2d'),im=g.getImageData(0,0,cv.width,cv.height),d=im.data,P=paletteOf(st),memo=new Map();
 for(let i=0;i<d.length;i+=4){const k=(d[i]<<16)|(d[i+1]<<8)|d[i+2];let m=memo.get(k);
  if(m===undefined){let bd=1e9;for(let j=0;j<P.length;j++){const p=P[j],dr=p[0]-d[i],dg=p[1]-d[i+1],db=p[2]-d[i+2],dd=dr*dr*0.3+dg*dg*0.59+db*db*0.11;if(dd<bd){bd=dd;m=j;}}memo.set(k,m);}
  const p=P[m];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;}
 g.putImageData(im,0,0);}
function vrender(cv,ex,t,hot,view,stKey,fr){const st=styleOf(stKey),W=cv.width,H=cv.height,pitch=CP.pitch;
 const px=CP.pix>1?Math.round(CP.pix):1,SS=px>1?4:1,L=Math.round(W/px),LH=Math.round(H/px);let tgt=cv;
 if(px>1){if(!PXC)PXC=document.createElement('canvas');if(PXC.width!==L*SS||PXC.height!==LH*SS){PXC.width=L*SS;PXC.height=LH*SS;}tgt=PXC;}
 const g=tgt.getContext('2d'),w=tgt.width,h=tgt.height;
 const [x0,y0,x1,y1]=fr,span=Math.max(x1-x0,(y1-y0))*1.12+2,s=Math.min(w,h)/Math.max(span,26),ox=w/2-(x0+x1)/2*s,oy=h/2-(y0+y1)/2*s;
 g.setTransform(1,0,0,1,0,0);g.fillStyle=st.bg;g.fillRect(0,0,w,h);
 const sc=vscene(ex,t,hot,(typeof YAWF==='function'?YAWF(ex,view):45+90*view),pitch);g.setTransform(s,0,0,s,ox,oy);
 g.strokeStyle=st.grid;g.lineWidth=(px>1?SS*1.0:1.8)/s;
 for(let i=-40;i<=40;i+=6){g.beginPath();let a=sc.P2([14+i,-40,0]),b=sc.P2([14+i,40,0]);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.beginPath();a=sc.P2([-26,i,0]);b=sc.P2([54,i,0]);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
 g.beginPath();g.ellipse(sc.shadow[0],sc.shadow[1],4.2,4.2*Math.sin(pitch*Math.PI/180),0,0,7);g.fillStyle=st.shadow;g.fill();
 vdraw(g,sc,st);g.setTransform(1,0,0,1,0,0);
 if(px>1){const P=paletteOf(st),im=g.getImageData(0,0,w,h).data,idx=new Uint8Array(w*h),memo=new Map();
  for(let i=0,q=0;q<idx.length;i+=4,q++){const k=(im[i]<<16)|(im[i+1]<<8)|im[i+2];let m=memo.get(k);
   if(m===undefined){let bd=1e9;m=0;for(let j=0;j<P.length;j++){const p=P[j],dr=p[0]-im[i],dg=p[1]-im[i+1],db=p[2]-im[i+2],dd=dr*dr*0.3+dg*dg*0.59+db*db*0.11;if(dd<bd){bd=dd;m=j;}}memo.set(k,m);}idx[q]=m;}
  const c2=cv.getContext('2d'),out=c2.createImageData(W,H),o=out.data,cnt=new Uint16Array(P.length),INKI=4,LI=new Uint8Array(L*LH),LO=new Uint8Array(L*LH);
  for(let y=0;y<LH;y++)for(let x=0;x<L;x++){cnt.fill(0);for(let yy=0;yy<SS;yy++)for(let xx=0;xx<SS;xx++)cnt[idx[(y*SS+yy)*w+x*SS+xx]]++;
   let b=0;for(let j=1;j<P.length;j++)if(cnt[j]>cnt[b])b=j;if(cnt[INKI]>=SS*SS*0.3&&b!==INKI&&b<4)b=INKI;
   LI[y*L+x]=b;}
  for(let y=0;y<LH;y++)for(let x=0;x<L;x++){const i=y*L+x;if(LI[i]>=4)continue;
   for(const n of [x>0?i-1:-1,x<L-1?i+1:-1,y>0?i-L:-1,y<LH-1?i+L:-1])if(n>=0&&LI[n]>4){LO[i]=1;break;}}
  for(let y=0;y<LH;y++)for(let x=0;x<L;x++){const i=y*L+x,b=LO[i]?INKI:LI[i];
   const p=P[b];for(let yy=0;yy<px;yy++){const Y=y*px+yy;if(Y>=H)break;for(let xx=0;xx<px;xx++){const X=x*px+xx;if(X>=W)break;const q=(Y*W+X)*4;o[q]=p[0];o[q+1]=p[1];o[q+2]=p[2];o[q+3]=255;}}}
  c2.putImageData(out,0,0);}}

const CTRL=[
 ['Cabeça',[['head','Tamanho da cabeça',0.6,1.8,0.02],['square','Forma: redonda → quadrada',0,1,0.02],['hairV','Volume do cabelo',0.7,1.3,0.02],['eye','Tamanho dos olhos',0,2,0.05]]],
 ['Corpo',[['shoulder','Largura dos ombros',0.7,1.5,0.02],['waist','Largura da cintura',0.7,1.4,0.02],['hips','Largura do quadril',0.7,1.4,0.02],['muscle','Musculatura',0.7,1.6,0.02]]],
 ['Braços e pernas',[['arm','Grossura dos braços',0.6,1.6,0.02],['leg','Grossura das pernas',0.6,1.6,0.02],['hand','Tamanho das mãos',0.5,1.8,0.05],['foot','Tamanho dos pés',0.5,1.8,0.05]]],
 ['Desenho',[['ow','Espessura do contorno',0,3,0.05],['cel','Intensidade da sombra',0,2,0.05],['pix','Pixelização (0 = liso)',0,10,1],['pitch','Ângulo da câmera',10,60,1]]]];
const COLS=[['cSkin','Pele'],['cHair','Cabelo'],['cShorts','Short'],['cBg','Fundo']];
const EXS=['rosca-direta','elevacao-lateral','supino-reto','remada-curvada','puxada-alta','goblet','agachamento-halteres','triceps-corda'];
const byId=Object.fromEntries(E.map(e=>[e.id,e]));let cur=0,view=0,FR={},t0=performance.now(),paused=false,tP=0;
try{const s=JSON.parse(localStorage.getItem('char_cfg')||'null');if(s)CP=Object.assign({},CP0,s);}catch(e){}
const save=()=>{try{localStorage.setItem('char_cfg',JSON.stringify(CP));}catch(e){}};
const fmt=(k,v)=>k==='pitch'?v+'°':k==='pix'?(v<2?'liso':v+' px'):(+v).toFixed(2);
function build(){
 document.querySelector('#chips').innerHTML=EXS.map((id,i)=>'<button class="chip'+(i===cur?' on':'')+'" data-i="'+i+'">'+byId[id].n+'</button>').join('');
 document.querySelector('#sty').innerHTML=Object.keys(VST).map(k=>'<button class="chip'+(CP.style===k?' on':'')+'" data-s="'+k+'">'+VST[k].n+'</button>').join('');
 let h='';for(const [g,items] of CTRL){h+='<h3>'+g+'</h3>';for(const [k,l,a,b,st] of items)h+='<label class="sl"><span>'+l+'<em id="v_'+k+'">'+fmt(k,CP[k])+'</em></span><input type="range" min="'+a+'" max="'+b+'" step="'+st+'" value="'+CP[k]+'" data-k="'+k+'"></label>';}
 h+='<h3>Cores</h3><div class="cols">';const sc=styleOf(CP.style);
 for(const [k,l] of COLS){const v=CP[k]||(k==='cBg'?sc.bg:sc.c[{cSkin:'skin',cHair:'hair',cShorts:'shorts'}[k]][0]);h+='<label class="col"><input type="color" value="'+v+'" data-c="'+k+'"><span>'+l+'</span></label>';}
 document.querySelector('#ctl').innerHTML=h+'</div>';}
function frameOf(ex){const v=(view+defView(ex))%4,k=ex.id+'|'+v+'|'+JSON.stringify(CP);if(!FR[k]){FR={};FR[k]=vframe(ex,v,CP.pitch);}return FR[k];}
function loop(now){const ex=byId[EXS[cur]],T=1700;if(!paused)tP=((now-t0)%T)/T;const ph=tP;let t,hot;
 if(ph<0.12){t=0;hot=0;}else if(ph<0.45){const u=(ph-0.12)/0.33;t=0.5-0.5*Math.cos(Math.PI*u);hot=1;}else if(ph<0.57){t=1;hot=1;}else{const u=(ph-0.57)/0.43;t=0.5+0.5*Math.cos(Math.PI*u);hot=0;}
 vrender(document.getElementById('cv'),ex,t,hot,(view+defView(ex))%4,CP.style,frameOf(ex));requestAnimationFrame(loop);}
document.addEventListener('input',e=>{const k=e.target.dataset.k,c=e.target.dataset.c;
 if(k){CP[k]=+e.target.value;document.getElementById('v_'+k).textContent=fmt(k,CP[k]);save();}
 if(c){CP[c]=e.target.value;save();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){cur=+b.dataset.i;build();}
 const s=e.target.closest('[data-s]');if(s){CP.style=s.dataset.s;CP.cSkin=CP.cHair=CP.cShorts=CP.cBg='';save();build();}
 if(e.target.closest('#rot'))view=(view+1)%4;
 if(e.target.closest('#pp')){paused=!paused;e.target.closest('#pp').textContent=paused?'▶ Tocar':'❚❚ Pausar';if(!paused)t0=performance.now()-tP*1700;}
 if(e.target.closest('#rst')){CP=Object.assign({},CP0,{style:CP.style});save();build();}
 if(e.target.closest('#cp')){const txt=JSON.stringify(CP);const o=document.getElementById('out');o.value=txt;o.hidden=false;o.select();
  try{navigator.clipboard.writeText(txt).then(()=>{document.getElementById('msg').textContent='Ajustes copiados. Cole aqui no chat quando quiser aplicar no app.';},()=>{document.getElementById('msg').textContent='Copie o texto acima e cole no chat.';});}catch(err){document.getElementById('msg').textContent='Copie o texto acima e cole no chat.';}}});
build();requestAnimationFrame(loop);

</script></body></html>
